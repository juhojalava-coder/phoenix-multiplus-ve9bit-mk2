name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages (Tk, virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb

      - name: Install Python dependencies (pinned in requirements.txt)
        run: python -m pip install -r requirements.txt

      - name: Run the test suite (emulator, protocol, MQTT, GUI under Xvfb)
        run: xvfb-run -a python scripts/run_tests.py

      - name: Release check (no private data, no image metadata)
        run: python scripts/build_release.py --check
